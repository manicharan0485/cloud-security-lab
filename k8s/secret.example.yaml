# --- SECRETS MANAGEMENT (example only - DO NOT commit real secrets) ---
# This file is a template. In real use:
#   1. Never commit an actual Secret manifest with real values to Git.
#   2. Prefer pulling secrets from AWS Secrets Manager / Parameter Store via
#      the External Secrets Operator, or the Secrets Store CSI Driver, so the
#      real value never touches a YAML file or Git history at all.
#   3. If you must use a native Secret, make sure etcd encryption at rest is
#      enabled on the cluster (this is a control-plane setting, not something
#      this file can enforce).
apiVersion: v1
kind: Secret
metadata:
  name: cloud-security-lab-secrets
  namespace: cloud-security-lab
type: Opaque
stringData:
  EXAMPLE_API_KEY: "replace-me-do-not-commit-a-real-value"
